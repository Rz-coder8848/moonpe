name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Update registry index
        run: moon update
      - name: Check
        run: moon check --deny-warn --target all
      - name: Build library
        run: moon build --deny-warn --target wasm-gc
      - name: Build CLI
        run: moon build cmd/moonpe --deny-warn --target js
      - name: Build example
        run: moon build examples/release_check --deny-warn --target js
      - name: Test (wasm-gc)
        run: moon test --deny-warn --target wasm-gc
      - name: Test (wasm)
        run: moon test --deny-warn --target wasm

# `moon fmt --check` is deliberately not a CI gate: its output depends on the
# toolchain release (older releases spell the default `Int` differently), and
# old toolchain builds are removed from the download server, so gating CI on it
# would tie the build to a version that expires. Formatting is enforced locally.
